# render.yaml — Render.com full stack config for AnonVibe NestJS Backend

services:
  # ── Backend (NestJS) ──
  - type: web
    name: anonvibe-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: npx prisma migrate deploy && npm run start:prod
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: anonvibe-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: anonvibe-redis
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false

  # ── Redis Cache ──
  - type: redis
    name: anonvibe-redis
    plan: free
    ipAllowList: [] # Bind to internal connections only for security

databases:
  # ── PostgreSQL Database ──
  - name: anonvibe-db
    plan: free
